# SonarCloud configuration, used by .github/workflows/sonarcloud.yml
# Copy both keys from sonarcloud.io > our project > Information.
sonar.organization=team-09-se2
sonar.projectKey=TEAM-09-SE2_SE2-MountainHut-Team09
sonar.projectName=SE2-MountainHut-Team09

# What is analysed: the whole repository, except these folders.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,App/figmaPrototype/**

# Test code is analysed for issues, but it is not counted in coverage
# or in duplications.
sonar.coverage.exclusions=App/backend/tests/**,App/frontend/tests/**,App/backend/scripts/**,App/docker/**,App/frontend/vite.config.ts
sonar.cpd.exclusions=App/backend/tests/**,App/frontend/tests/**

# The coverage reports are passed by the workflow, only for pull requests
# into dev or main and for pushes to dev or main.
