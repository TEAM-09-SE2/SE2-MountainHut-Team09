# SonarCloud configuration, used by .github/workflows/sonarcloud.yml
# Copy both keys from sonarcloud.io > our project > Information.
sonar.organization=team-09-se2
sonar.projectKey=TEAM-09-SE2_SE2-MountainHut-Team09
sonar.projectName=SE2-MountainHut-Team09

# What is analysed
sonar.sources=App
sonar.tests=App/backend/tests,App/frontend/tests
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,App/backend/tests/**,App/frontend/tests/**,App/figmaPrototype/**
sonar.coverage.exclusions=App/backend/scripts/**,App/docker/**

# Coverage reports produced by the workflow
sonar.javascript.lcov.reportPaths=App/backend/coverage/lcov.info,App/frontend/coverage/lcov.info