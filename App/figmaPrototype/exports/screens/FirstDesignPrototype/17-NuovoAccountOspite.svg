<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="810" viewBox="0 0 1048 810"><title>Nuovo account ospite</title><rect x="0" y="0" width="1048" height="810" rx="0" fill="#F4F2EC" stroke="#F4F2EC"/><rect x="0" y="0" width="1048" height="4" rx="0" fill="#244B3D" stroke="#244B3D"/><rect x="0" y="4" width="1048" height="64" rx="0" fill="#FFFEFB" stroke="#FFFEFB"/><line x1="0" y1="68" x2="1048" y2="68" stroke="#E7E3D9"/><rect x="44" y="20" width="30" height="30" rx="8" fill="#E9EFE8" stroke="none"/><path d="M50 42 57 29l5 8 4-5 5 10z" fill="none" stroke="#315B49" stroke-width="1.8" stroke-linejoin="round"/><text x="84" y="34" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#294237" text-anchor="start">Mountain Hut</text><text x="84" y="48" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#777B73" text-anchor="start">RIFUGIO LARICE · 2.180 M</text><text x="414" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Servizio del giorno</text><text x="530" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="start">Prenotazioni</text><text x="690" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Pianificazione</text><line x1="528" y1="57" x2="602" y2="57" stroke="#315B49"/><circle cx="931" cy="36" r="15" fill="#E9EFE8"/><text x="931" y="40" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#244B3D" text-anchor="middle">MR</text><text x="954" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Matteo · Staff</text><text x="48" y="105" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#738073" text-anchor="start">AREA STAFF  /  NUOVA PRENOTAZIONE</text><text x="48" y="141" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#243B32" text-anchor="start">Nuovo account ospite</text><text x="48" y="161" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#777B73" text-anchor="start">Inserisci i dati necessari per la prenotazione.</text><rect x="48" y="181" width="604" height="540" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="70" y="213" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Crea un account</text><text x="70" y="232" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">L'ospite riceverà una password temporanea da te.</text><rect x="70" y="240" width="142" height="22" rx="10" fill="#E9F0E7" stroke="none"/><text x="141" y="255" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#244B3D" text-anchor="middle">Nuovo account</text><text x="70" y="289" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Nome *</text><rect x="70" y="297" width="268" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="82" y="319" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Giulia</text><text x="354" y="289" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Cognome *</text><rect x="354" y="297" width="276" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="366" y="319" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Conti</text><text x="70" y="363" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Email *</text><rect x="70" y="371" width="560" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="82" y="393" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">giulia.conti@example.com</text><text x="70" y="438" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Telefono (facoltativo)</text><rect x="70" y="446" width="268" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="82" y="468" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">+39 333 000 0000</text><text x="354" y="438" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Contatto emergenza (facoltativo)</text><rect x="354" y="446" width="276" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="366" y="468" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Nome e telefono</text><text x="70" y="513" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Note (facoltativo)</text><rect x="70" y="521" width="560" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="82" y="543" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Informazioni utili per lo staff</text><rect x="70" y="648" width="120" height="34" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/><text x="130" y="670" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="middle">← Indietro</text><rect x="464" y="648" width="166" height="34" rx="6" fill="#244B3D" stroke="#244B3D"/><text x="547" y="670" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Scegli il turno →</text><rect x="672" y="181" width="328" height="112" rx="7" fill="#F5ECD9" stroke="none"/><text x="688" y="203" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#806031" text-anchor="start">Password temporanea</text><text x="688" y="222" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">Generata alla conferma e mostrata una</text><text x="688" y="237" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">sola volta. Comunicala all'ospite: non</text><text x="688" y="252" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">viene inviata via email.</text><rect x="672" y="310" width="328" height="226" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="694" y="341" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Email già utilizzata</text><text x="694" y="360" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Stato alternativo</text><text x="694" y="390" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Email *</text><rect x="694" y="398" width="284" height="35" rx="5" fill="#FFFEFB" stroke="#CA8D81"/><text x="706" y="420" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#A64D3F" text-anchor="start">giulia.conti@example.com</text><text x="694" y="454" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#A64D3F" text-anchor="start">Questa email è già associata a un account.</text><rect x="694" y="475" width="284" height="34" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/><text x="836" y="497" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="middle">Cerca un ospite esistente</text><line x1="0" y1="778" x2="1048" y2="778" stroke="#E7E3D9"/><text x="44" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="start">Mountain Hut — Team 09 · Software Engineering II · Politecnico di Torino</text><text x="1004" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="end">Prototipo · Area staff</text></svg>