<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="810" viewBox="0 0 1048 810">
  <title>Registra un'escursione - escursionista</title>
  <rect width="1048" height="810" fill="#F4F2EC"/>
  <rect width="1048" height="4" fill="#244B3D"/>
  <rect y="4" width="1048" height="64" fill="#FFFEFB"/>
  <text x="48" y="39" font-family="Arial" font-size="15" fill="#294237">△  Mountain Hut</text>
  <text x="420" y="39" font-family="Arial" font-size="10" fill="#777B73">Il rifugio</text>
  <text x="530" y="39" font-family="Arial" font-size="10" fill="#777B73">Le mie prenotazioni</text>
  <text x="690" y="39" font-family="Arial" font-size="10" fill="#244B3D">Le mie escursioni</text>
  <text x="930" y="39" font-family="Arial" font-size="10" fill="#39483F">GC  Giulia Conti</text>
  <text x="48" y="106" font-family="Arial" font-size="9" fill="#738073">LE MIE ESCURSIONI  /  NUOVA</text>
  <text x="48" y="143" font-family="Georgia" font-size="29" fill="#243B32">Registra un'escursione</text>
  <text x="48" y="165" font-family="Arial" font-size="11" fill="#777B73">Condividi con il rifugio il percorso che hai in programma.</text>
  <rect x="48" y="187" width="605" height="535" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/>
  <text x="70" y="220" font-family="Georgia" font-size="19" fill="#243B32">Il tuo itinerario</text>
  <rect x="433" y="198" width="198" height="34" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/>
  <text x="532" y="220" font-family="Arial" font-size="10" font-weight="bold" fill="#244B3D" text-anchor="middle">Scegli un percorso proposto</text>
  <text x="70" y="262" font-family="Arial" font-size="10" font-weight="bold" fill="#39483F">Destinazione *</text>
  <rect x="70" y="273" width="561" height="40" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/>
  <text x="84" y="298" font-family="Arial" font-size="11" fill="#39483F">Punta del Lago</text>
  <text x="70" y="343" font-family="Arial" font-size="10" font-weight="bold" fill="#39483F">Descrizione del percorso *</text>
  <rect x="70" y="354" width="561" height="80" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/>
  <text x="84" y="380" font-family="Arial" font-size="11" fill="#39483F">Dal rifugio attraverso il sentiero del lago.</text>
  <text x="70" y="466" font-family="Arial" font-size="10" font-weight="bold" fill="#39483F">Punti di passaggio · facoltativi</text>
  <rect x="70" y="478" width="561" height="39" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/>
  <text x="84" y="503" font-family="Arial" font-size="11" fill="#39483F">1   Lago del Larice</text>
  <text x="615" y="503" font-family="Arial" font-size="10" fill="#244B3D" text-anchor="end">Rimuovi</text>
  <text x="70" y="546" font-family="Arial" font-size="10" font-weight="bold" fill="#244B3D">+ Aggiungi punto di passaggio</text>
  <text x="70" y="573" font-family="Arial" font-size="10" fill="#777B73">Nell'ordine del percorso · massimo 20 punti</text>
  <text x="70" y="601" font-family="Arial" font-size="10" fill="#777B73">* Campi obbligatori</text>
  <rect x="70" y="650" width="118" height="38" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/>
  <text x="129" y="674" font-family="Arial" font-size="10" font-weight="bold" fill="#244B3D" text-anchor="middle">Annulla</text>
  <rect x="460" y="650" width="171" height="38" rx="6" fill="#244B3D"/>
  <text x="545" y="674" font-family="Arial" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Registra escursione</text>
  <rect x="673" y="187" width="327" height="182" rx="9" fill="#244B3D"/>
  <text x="693" y="216" font-family="Arial" font-size="9" font-weight="bold" fill="#BACCC1">PRIMA DI PARTIRE</text>
  <text x="693" y="250" font-family="Georgia" font-size="21" fill="#fff">In montagna, insieme.</text>
  <text x="693" y="280" font-family="Arial" font-size="10" fill="#D8E6DD">Un itinerario chiaro aiuta lo staff a</text>
  <text x="693" y="297" font-family="Arial" font-size="10" fill="#D8E6DD">comprendere i tuoi piani.</text>
  <text x="693" y="330" font-family="Arial" font-size="10" fill="#D8E6DD">Non sostituisce le procedure di soccorso.</text>
  <rect x="673" y="386" width="327" height="105" rx="7" fill="#E9F0E7"/>
  <text x="689" y="410" font-family="Arial" font-size="10" font-weight="bold" fill="#244B3D">Parti da un percorso proposto</text>
  <text x="689" y="430" font-family="Arial" font-size="10" fill="#244B3D">Puoi adattare destinazione, descrizione</text>
  <text x="689" y="447" font-family="Arial" font-size="10" fill="#244B3D">e punti senza modificare il modello.</text>
  <text x="48" y="780" font-family="Arial" font-size="8" fill="#898A82">Mountain Hut — Team 09 · Prototipo statico</text>
</svg>
