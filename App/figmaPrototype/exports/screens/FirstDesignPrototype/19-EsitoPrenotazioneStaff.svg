<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="810" viewBox="0 0 1048 810"><title>Prenotazione registrata</title><rect x="0" y="0" width="1048" height="810" rx="0" fill="#F4F2EC" stroke="#F4F2EC"/><rect x="0" y="0" width="1048" height="4" rx="0" fill="#244B3D" stroke="#244B3D"/><rect x="0" y="4" width="1048" height="64" rx="0" fill="#FFFEFB" stroke="#FFFEFB"/><line x1="0" y1="68" x2="1048" y2="68" stroke="#E7E3D9"/><rect x="44" y="20" width="30" height="30" rx="8" fill="#E9EFE8" stroke="none"/><path d="M50 42 57 29l5 8 4-5 5 10z" fill="none" stroke="#315B49" stroke-width="1.8" stroke-linejoin="round"/><text x="84" y="34" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#294237" text-anchor="start">Mountain Hut</text><text x="84" y="48" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#777B73" text-anchor="start">RIFUGIO LARICE · 2.180 M</text><text x="414" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Servizio del giorno</text><text x="530" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="start">Prenotazioni</text><text x="690" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Pianificazione</text><line x1="528" y1="57" x2="602" y2="57" stroke="#315B49"/><circle cx="931" cy="36" r="15" fill="#E9EFE8"/><text x="931" y="40" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#244B3D" text-anchor="middle">MR</text><text x="954" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Matteo · Staff</text><text x="48" y="105" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#738073" text-anchor="start">AREA STAFF  /  ESITO</text><text x="48" y="141" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#243B32" text-anchor="start">Prenotazione registrata</text><text x="48" y="161" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#777B73" text-anchor="start">Riepilogo e informazioni da comunicare all'ospite.</text><rect x="48" y="181" width="952" height="64" rx="7" fill="#E9F0E7" stroke="none"/><text x="64" y="203" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#244B3D" text-anchor="start">Prenotazione confermata · MH-1801</text><text x="64" y="222" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">Paolo Riva · sabato 18 luglio, 19:00 · 4 persone.</text><rect x="48" y="261" width="565" height="252" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="70" y="292" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Ospite temporaneo</text><rect x="70" y="313" width="126" height="22" rx="10" fill="#F5ECD9" stroke="none"/><text x="133" y="328" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#8C6C37" text-anchor="middle">Temporaneo</text><text x="70" y="363" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#39483F" text-anchor="start">Nessuna email di conferma inviata.</text><text x="70" y="389" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">L'ospite temporaneo non dispone di accesso.</text><rect x="70" y="447" width="206" height="34" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/><text x="173" y="469" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="middle">Vai alle prenotazioni</text><rect x="633" y="261" width="367" height="252" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="655" y="292" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Nuovo account</text><text x="655" y="311" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Stato alternativo · mostrato una sola volta</text><rect x="655" y="329" width="323" height="57" rx="6" fill="#F7F5EF" stroke="none"/><text x="671" y="351" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#777B73" text-anchor="start">PASSWORD TEMPORANEA</text><text x="671" y="374" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#39483F" text-anchor="start">Esempio: ••••••••••••</text><text x="655" y="418" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#39483F" text-anchor="start">Comunica la password all'ospite.</text><text x="655" y="438" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Non viene inviata per email e non sarà</text><text x="655" y="454" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">mostrata di nuovo. Va cambiata al primo accesso.</text><rect x="48" y="532" width="952" height="84" rx="7" fill="#E9F0E7" stroke="none"/><text x="64" y="554" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#244B3D" text-anchor="start">Per gli account con email</text><text x="64" y="573" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">La conferma della prenotazione può essere inviata via email; un errore di invio</text><text x="64" y="588" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">non annulla la prenotazione. Mostra sempre l'esito effettivo dell'invio.</text><line x1="0" y1="778" x2="1048" y2="778" stroke="#E7E3D9"/><text x="44" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="start">Mountain Hut — Team 09 · Software Engineering II · Politecnico di Torino</text><text x="1004" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="end">Prototipo · Area staff</text></svg>