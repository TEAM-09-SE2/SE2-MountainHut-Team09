zione</text><text x="48" y="161" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#777B73" text-anchor="start">Cambia data, turno, gruppo o esigenze.</text><rect x="48" y="181" width="604" height="541" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="70" y="212" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Modifica i dettagli</text><text x="70" y="231" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">I dati attuali sono già compilati.</text><text x="70" y="252" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Data</text><rect x="70" y="260" width="268" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="82" y="282" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Sabato 18 luglio 2026  ▾</text><text x="354" y="252" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Turno</text><rect x="354" y="260" width="276" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="366" y="282" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Cena · 19:00 – 20:15  ▾</text><text x="70" y="325" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Persone</text><rect x="70" y="333" width="268" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="82" y="355" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">−     4     +</text><text x="70" y="397" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#39483F" text-anchor="start">Esigenze del gruppo</text><text x="630" y="397" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#244B3D" text-anchor="end">+ Aggiungi</text><rect x="70" y="414" width="560" height="70" rx="7" fill="#F7F5EF" stroke="none"/><text x="84" y="434" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#39483F" text-anchor="start">1 persona</text><rect x="180" y="419" width="95" height="22" rx="10" fill="#F9EDE8" stroke="none"/><text x="227.5" y="434" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#A64D3F" text-anchor="middle">Allergia</text><text x="84" y="459" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#A64D3F" text-anchor="start">Frutta a guscio</text><text x="614" y="459" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#244B3D" text-anchor="end">Modifica  ·  Rimuovi</text><rect x="70" y="493" width="560" height="62" rx="7" fill="#F7F5EF" stroke="none"/><text x="84" y="515" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#39483F" text-anchor="start">2 persone</text><text x="84" y="538" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Vegetariano</text><text x="614" y="538" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#244B3D" text-anchor="end">Modifica  ·  Rimuovi</text><text x="70" y="583" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">3 di 4 persone associate · massimo 4</text><rect x="70" y="648" width="128" height="34" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/><text x="134" y="670" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="middle">Annulla</text><rect x="446" y="648" width="184" height="34" rx="6" fill="#244B3D" stroke="#244B3D"/><text x="538" y="670" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Salva modifiche</text><rect x="672" y="181" width="328" height="218" rx="10" fill="#244B3D" stroke="#244B3D"/><text x="692" y="207" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#BACCC1" text-anchor="start">PRENOTAZIONE ATTUALE</text><text x="692" y="240" font-family="Georgia,serif" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="start">Rifugio Larice</text><text x="692" y="263" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#D8E6DD" text-anchor="start">Sabato 18 luglio 2026</text><line x1="692" y1="279" x2="980" y2="279" stroke="#486C5C"/><text x="692" y="304" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#D8E6DD" text-anchor="start">Cena · primo turno</text><text x="980" y="304" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="end">19:00 – 20:15</text><text x="692" y="331" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#D8E6DD" text-anchor="start">Partecipanti</text><text x="980" y="331" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="end">4 persone</text><text x="692" y="369" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#D8E6DD" text-anchor="start">I tavoli vengono assegnati automaticamente.</text><rect x="672" y="415" width="328" height="90" rx="7" fill="#F5ECD9" stroke="none"/><text x="688" y="437" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#806031" text-anchor="start">Prima di salvare</text><text x="688" y="456" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">La disponibilità viene verificata di nuovo.</text><text x="688" y="471" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">Se i posti non bastano, la prenotazione</text><text x="688" y="486" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">attuale rimane invariata.</text><rect x="672" y="521" width="328" height="90" rx="7" fill="#E9F0E7" stroke="none"/><text x="688" y="543" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#244B3D" text-anchor="start">Termine per le modifiche</text><text x="688" y="562" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">Le modifiche chiudono 48 ore prima</text><text x="688" y="577" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">dell'inizio del turno attuale.</text><line x1="0" y1="778" x2="1048" y2="778" stroke="#E7E3D9"/><text x="44" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="start">Mountain Hut — Team 09 · Software Engineering II · Politecnico di Torino</text><text x="1004" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="end">Prototipo · Prenotazioni</text></svg>