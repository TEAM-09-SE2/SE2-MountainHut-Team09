ite</text><text x="48" y="161" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#777B73" text-anchor="start">Cerca un profilo già presente nel rifugio.</text><rect x="48" y="181" width="604" height="500" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="70" y="213" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Cerca un ospite esistente</text><text x="70" y="232" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Per nome, telefono o indirizzo email.</text><rect x="70" y="240" width="153" height="22" rx="10" fill="#E9F0E7" stroke="none"/><text x="146.5" y="255" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#244B3D" text-anchor="middle">Cerca esistente</text><text x="70" y="290" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Cerca</text><rect x="70" y="298" width="560" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="82" y="320" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Paolo Riva</text><rect x="70" y="353" width="560" height="69" rx="7" fill="#E9F0E7" stroke="#B7CBB7"/><text x="86" y="379" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#39483F" text-anchor="start">Paolo Riva</text><rect x="434" y="362" width="113" height="22" rx="10" fill="#F5ECD9" stroke="none"/><text x="490.5" y="377" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#8C6C37" text-anchor="middle">Temporaneo</text><text x="86" y="400" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Telefono · +39 333 000 0000</text><text x="612" y="391" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#244B3D" text-anchor="end">✓</text><rect x="70" y="433" width="560" height="69" rx="7" fill="#FFFEFB" stroke="#E7E3D9"/><text x="86" y="459" font-famil