<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="810" viewBox="0 0 1048 810"><title>Recupera l'accesso</title><rect x="0" y="0" width="1048" height="810" rx="0" fill="#F4F2EC" stroke="#F4F2EC"/><rect x="0" y="0" width="1048" height="4" rx="0" fill="#244B3D" stroke="#244B3D"/><rect x="0" y="4" width="1048" height="64" rx="0" fill="#FFFEFB" stroke="#FFFEFB"/><line x1="0" y1="68" x2="1048" y2="68" stroke="#E7E3D9"/><rect x="44" y="20" width="30" height="30" rx="8" fill="#E9EFE8" stroke="none"/><path d="M50 42 57 29l5 8 4-5 5 10z" fill="none" stroke="#315B49" stroke-width="1.8" stroke-linejoin="round"/><text x="84" y="34" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#294237" text-anchor="start">Mountain Hut</text><text x="84" y="48" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#777B73" text-anchor="start">RIFUGIO LARICE · 2.180 M</text><text x="414" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Il rifugio</text><text x="530" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="start">Le mie prenotazioni</text><text x="690" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Informazioni utili</text><line x1="528" y1="57" x2="638" y2="57" stroke="#315B49"/><circle cx="931" cy="36" r="15" fill="#E9EFE8"/><text x="931" y="40" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#244B3D" text-anchor="middle">GC</text><text x="954" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Giulia Conti</text><text x="48" y="105" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#738073" text-anchor="start">AREA PERSONALE  /  ACCESSO</text><text x="48" y="141" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#243B32" text-anchor="start">Recupera l'accesso</text><text x="48" y="161" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#777B73" text-anchor="start">Richiedi un link per scegliere una nuova password.</text><rect x="48" y="181" width="385" height="512" rx="10" fill="#244B3D" stroke="#244B3D"/><text x="76" y="226" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#CEDDD1" text-anchor="start">RIFUGIO LARICE</text><text x="76" y="280" font-family="Georgia,serif" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start">Ritrova la strada</text><text x="76" y="316" font-family="Georgia,serif" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start">verso il tuo account.</text><text x="76" y="356" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#D8E6DD" text-anchor="start">Ti aiutiamo a tornare alle tue</text><text x="76" y="375" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#D8E6DD" text-anchor="start">prenotazioni in pochi passaggi.</text><path d="M72 571 L148 475 L190 525 L248 432 L334 557 L365 510 L407 571 Z" fill="none" stroke="#71916F" stroke-width="3"/><rect x="453" y="181" width="547" height="512" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="481" y="219" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Password dimenticata?</text><text x="481" y="238" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Inserisci l'email associata al tuo account.</text><text x="481" y="285" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Email</text><rect x="481" y="293" width="491" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="493" y="315" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">nome@esempio.it</text><rect x="481" y="353" width="491" height="34" rx="6" fill="#244B3D" stroke="#244B3D"/><text x="726.5" y="375" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Invia il link di recupero</text><text x="726" y="414" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="middle">← Torna all'accesso</text><rect x="481" y="464" width="491" height="101" rx="7" fill="#E9F0E7" stroke="none"/><text x="497" y="486" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#244B3D" text-anchor="start">Stato alternativo · richiesta inviata</text><text x="497" y="505" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">Se esiste un account associato a questa email,</text><text x="497" y="520" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">riceverai un link per impostare una nuova password.</text><text x="497" y="535" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">Controlla anche la cartella spam.</text><line x1="0" y1="778" x2="1048" y2="778" stroke="#E7E3D9"/><text x="44" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="start">Mountain Hut — Team 09 · Software Engineering II · Politecnico di Torino</text><text x="1004" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="end">Prototipo · Prenotazioni</text></svg>