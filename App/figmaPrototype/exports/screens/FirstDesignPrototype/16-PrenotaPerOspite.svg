<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="810" viewBox="0 0 1048 810"><title>Prenota per un ospite</title><rect x="0" y="0" width="1048" height="810" rx="0" fill="#F4F2EC" stroke="#F4F2EC"/><rect x="0" y="0" width="1048" height="4" rx="0" fill="#244B3D" stroke="#244B3D"/><rect x="0" y="4" width="1048" height="64" rx="0" fill="#FFFEFB" stroke="#FFFEFB"/><line x1="0" y1="68" x2="1048" y2="68" stroke="#E7E3D9"/><rect x="44" y="20" width="30" height="30" rx="8" fill="#E9EFE8" stroke="none"/><path d="M50 42 57 29l5 8 4-5 5 10z" fill="none" stroke="#315B49" stroke-width="1.8" stroke-linejoin="round"/><text x="84" y="34" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#294237" text-anchor="start">Mountain Hut</text><text x="84" y="48" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#777B73" text-anchor="start">RIFUGIO LARICE · 2.180 M</text><text x="414" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Servizio del giorno</text><text x="530" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="start">Prenotazioni</text><text x="690" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Pianificazione</text><line x1="528" y1="57" x2="602" y2="57" stroke="#315B49"/><circle cx="931" cy="36" r="15" fill="#E9EFE8"/><text x="931" y="40" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#244B3D" text-anchor="middle">MR</text><text x="954" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Matteo · Staff</text><text x="48" y="105" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#738073" text-anchor="start">AREA STAFF  /  NUOVA PRENOTAZIONE</text><text x="48" y="141" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#243B32" text-anchor="start">Prenota per un ospite</text><text x="48" y="161" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#777B73" text-anchor="start">Registra una richiesta ricevuta al rifugio o per telefono.</text><rect x="48" y="181" width="952" height="44" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="72" y="208" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#244B3D" text-anchor="start">01  Ospite</text><text x="310" y="208" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">02  Turno e gruppo</text><text x="570" y="208" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">03  Esigenze</text><text x="795" y="208" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">04  Riepilogo</text><rect x="48" y="241" width="604" height="473" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="70" y="274" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Chi viene al rifugio?</text><text x="70" y="293" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Scegli come identificare l'ospite.</text><rect x="70" y="301" width="165" height="22" rx="10" fill="#E9F0E7" stroke="none"/><text x="152.5" y="316" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#244B3D" text-anchor="middle">Ingresso rapido</text><rect x="244" y="301" width="155" height="22" rx="10" fill="#ECEAE4" stroke="none"/><text x="321.5" y="316" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#777B73" text-anchor="middle">Cerca esistente</text><rect x="408" y="301" width="171" height="22" rx="10" fill="#ECEAE4" stroke="none"/><text x="493.5" y="316" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#777B73" text-anchor="middle">Nuovo account</text><rect x="70" y="340" width="560" height="66" rx="7" fill="#E9F0E7" stroke="none"/><text x="86" y="362" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#244B3D" text-anchor="start">Ospite temporaneo</text><text x="86" y="381" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">Ideale per telefono o arrivi al rifugio. Non può accedere e non riceve email.</text><text x="70" y="439" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Nome *</text><rect x="70" y="447" width="268" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="82" y="469" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Paolo</text><text x="354" y="439" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Cognome *</text><rect x="354" y="447" width="276" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="366" y="469" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Riva</text><text x="70" y="510" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Telefono (facoltativo)</text><rect x="70" y="518" width="268" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="82" y="540" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">+39 333 000 0000</text><rect x="70" y="648" width="118" height="34" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/><text x="129" y="670" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="middle">Annulla</text><rect x="466" y="648" width="164" height="34" rx="6" fill="#244B3D" stroke="#244B3D"/><text x="548" y="670" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Scegli il turno →</text><rect x="672" y="241" width="328" height="212" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="694" y="274" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Cerca un ospite</text><text x="694" y="293" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Alternativa: ospite già registrato</text><text x="694" y="320" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Nome, telefono o email</text><rect x="694" y="328" width="284" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="706" y="350" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Cerca un ospite...</text><text x="694" y="389" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Seleziona un risultato esistente,</text><text x="694" y="405" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">anche se è un ospite temporaneo.</text><rect x="672" y="470" width="328" height="110" rx="7" fill="#E9F0E7" stroke="none"/><text x="688" y="492" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#244B3D" text-anchor="start">Tre possibilità</text><text x="688" y="511" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">Ospite temporaneo: dati minimi.</text><text x="688" y="526" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">Esistente: cerca e seleziona.</text><text x="688" y="541" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">Nuovo account: l'ospite potrà accedere.</text><text x="688" y="556" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">I dati vengono creati solo alla conferma.</text><line x1="0" y1="778" x2="1048" y2="778" stroke="#E7E3D9"/><text x="44" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="start">Mountain Hut — Team 09 · Software Engineering II · Politecnico di Torino</text><text x="1004" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="end">Prototipo · Area staff</text></svg>