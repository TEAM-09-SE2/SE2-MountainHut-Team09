<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="810" viewBox="0 0 1048 810"><title>Prenotazione annullata</title><rect x="0" y="0" width="1048" height="810" rx="0" fill="#F4F2EC" stroke="#F4F2EC"/><rect x="0" y="0" width="1048" height="4" rx="0" fill="#244B3D" stroke="#244B3D"/><rect x="0" y="4" width="1048" height="64" rx="0" fill="#FFFEFB" stroke="#FFFEFB"/><line x1="0" y1="68" x2="1048" y2="68" stroke="#E7E3D9"/><rect x="44" y="20" width="30" height="30" rx="8" fill="#E9EFE8" stroke="none"/><path d="M50 42 57 29l5 8 4-5 5 10z" fill="none" stroke="#315B49" stroke-width="1.8" stroke-linejoin="round"/><text x="84" y="34" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#294237" text-anchor="start">Mountain Hut</text><text x="84" y="48" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#777B73" text-anchor="start">RIFUGIO LARICE · 2.180 M</text><text x="414" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Il rifugio</text><text x="530" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="start">Le mie prenotazioni</text><text x="690" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Informazioni utili</text><line x1="528" y1="57" x2="638" y2="57" stroke="#315B49"/><circle cx="931" cy="36" r="15" fill="#E9EFE8"/><text x="931" y="40" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#244B3D" text-anchor="middle">GC</text><text x="954" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Giulia Conti</text><text x="48" y="105" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#738073" text-anchor="start">PRENOTAZIONI  /  ESITO</text><text x="48" y="141" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#243B32" text-anchor="start">Prenotazione annullata</text><text x="48" y="161" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#777B73" text-anchor="start">Il riepilogo resta disponibile nello storico.</text><rect x="48" y="181" width="952" height="64" rx="7" fill="#E9F0E7" stroke="none"/><text x="64" y="203" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#244B3D" text-anchor="start">Prenotazione annullata</text><text x="64" y="222" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">I posti sono stati liberati. Email di annullamento inviata.</text><rect x="48" y="261" width="604" height="265" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="70" y="293" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Riepilogo</text><text x="70" y="312" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Prenotazione MH-1804</text><rect x="527" y="277" width="102" height="22" rx="10" fill="#ECEAE4" stroke="none"/><text x="578" y="292" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#777B73" text-anchor="middle">Annullata</text><text x="70" y="342" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#777B73" text-anchor="start">TURNO</text><text x="70" y="362" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#39483F" text-anchor="start">Sabato 18 luglio · 19:00</text><text x="354" y="342" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#777B73" text-anchor="start">GRUPPO</text><text x="354" y="362" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#39483F" text-anchor="start">4 persone</text><text x="70" y="405" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Annullata il 16 luglio 2026 · da Giulia Conti</text><rect x="70" y="462" width="196" height="34" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/><text x="168" y="484" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="middle">Le mie prenotazioni</text><rect x="672" y="261" width="328" height="265" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="694" y="293" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Conferma email</text><rect x="694" y="312" width="110" height="22" rx="10" fill="#E9F0E7" stroke="none"/><text x="749" y="327" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#244B3D" text-anchor="middle">Email inviata</text><text x="694" y="365" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#39483F" text-anchor="start">Inviata a giulia.conti@example.com</text><text x="694" y="400" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">L'annullamento resta valido anche</text><text x="694" y="416" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">se la comunicazione non va a buon fine.</text><rect x="48" y="545" width="952" height="86" rx="7" fill="#F5ECD9" stroke="none"/><text x="64" y="567" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#806031" text-anchor="start">Stati alternativi</text><text x="64" y="586" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">Email non inviata: l'annullamento è comunque confermato. Ospite temporaneo: nessuna email prevista.</text><text x="64" y="601" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">Se il turno è già iniziato o la prenotazione è già annullata, l'azione non è disponibile.</text><line x1="0" y1="778" x2="1048" y2="778" stroke="#E7E3D9"/><text x="44" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="start">Mountain Hut — Team 09 · Software Engineering II · Politecnico di Torino</text><text x="1004" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="end">Prototipo · Prenotazioni</text></svg>