" width="328" height="92" rx="7" fill="#F5ECD9" stroke="none"/><text x="688" y="498" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#806031" text-anchor="start">Attenzione alle allergie</text><text x="688" y="517" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">Le allergie sono evidenziate per lo staff.</text><text x="688" y="532" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">La cucina è condivisa: contatta il rifugio.</text><rect x="672" y="580" width="328" height="88" rx="7" fill="#E9F0E7" stroke="none"/><text x="688" y="602" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#244B3D" text-anchor="start">Controllo del gruppo</text><text x="688" y="621" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">Il totale delle persone nelle esigenze</text><text x="688" y="636" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">non può superare la dimensione del gruppo.</text><line x1="0" y1="778" x2="1048" y2="778" stroke="#E7E3D9"/><text x="44" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="start">Mountain Hut — Team 09 · Software Engineering II · Politecnico di Torino</text><text x="1004" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="end">Prototipo · Prenotazioni</text></svg>