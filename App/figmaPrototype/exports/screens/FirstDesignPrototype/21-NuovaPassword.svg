password</text><text x="48" y="161" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#777B73" text-anchor="start">Imposta la password e accedi di nuovo.</text><rect x="48" y="181" width="385" height="512" rx="10" fill="#244B3D" stroke="#244B3D"/><text x="76" y="226" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#CEDDD1" text-anchor="start">RIFUGIO LARICE</text><text x="76" y="280" font-family="Georgia,serif" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start">Un nuovo inizio,</text><text x="76" y="316" font-family="Georgia,serif" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start">in quota.</text><text x="76" y="356" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#D8E6DD" text-anchor="start">Scegli una nuova password</text><text x="76" y="375" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#D8E6DD" text-anchor="start">per proteggere il tuo account.</text><path d="M72 571 L148 475 L190 525 L248 432 L334 557 L365 510 L407 571 Z" fill="none" stroke="#71916F" stroke-width="3"/><rect x="453" y="181" width="547" height="512" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="481" y="219" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Imposta una nuova password</text><text x="481" y="238" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Apri questa pagina dal link ricevuto via email.</text><text x="481" y="278" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Nuova password</text><rect x="481" y="286" width="491" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="493" y="308" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">••••••••••••</text><text x="481" y="353" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#39483F" text-anchor="start">Conferma password</text><rect x="481" y="361" width="491" height="35" rx="5" fill="#FFFEFB" stroke="#DEDCD3"/><text x="493" y="383" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">••••••••••••</text><text x="481" y="415" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Usa almeno 8 caratteri, con lettere e numeri.</text><rect x="481" y="445" width="491" height="34" rx="6" fill="#244B3D" stroke="#244B3D"/><text x="726.5" y="467" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Salva nuova password</text><rect x="481" y="504" width="491" height="94" rx="7" fill="#F5ECD9" stroke="none"/><text x="497" y="526" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#806031" text-anchor="start">Stato alternativo · link scaduto o non valido</text><text x="497" y="545" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">Il link non può più essere utilizzato. Richiedine uno nuovo.</text><text x="497" y="560" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">Il link è valido per un'ora e può essere usato una sola volta.</text><rect x="481" y="613" width="238" height="34" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/><text x="600" y="635" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="middle">Richiedi un nuovo link</text><text x="850" y="635" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="middle">Torna all'accesso</text><line x1="0" y1="778" x2="1048" y2="778" stroke="#E7E3D9"/><text x="44" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="start">Mountain Hut — Team 09 · Software Engineering II · Politecnico di Torino</text><text x="1004" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="end">Prototipo · Prenotazioni</text></svg>