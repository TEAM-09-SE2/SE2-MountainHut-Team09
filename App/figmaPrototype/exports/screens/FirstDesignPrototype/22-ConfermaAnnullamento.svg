<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="810" viewBox="0 0 1048 810"><title>Annulla prenotazione</title><rect x="0" y="0" width="1048" height="810" rx="0" fill="#F4F2EC" stroke="#F4F2EC"/><rect x="0" y="0" width="1048" height="4" rx="0" fill="#244B3D" stroke="#244B3D"/><rect x="0" y="4" width="1048" height="64" rx="0" fill="#FFFEFB" stroke="#FFFEFB"/><line x1="0" y1="68" x2="1048" y2="68" stroke="#E7E3D9"/><rect x="44" y="20" width="30" height="30" rx="8" fill="#E9EFE8" stroke="none"/><path d="M50 42 57 29l5 8 4-5 5 10z" fill="none" stroke="#315B49" stroke-width="1.8" stroke-linejoin="round"/><text x="84" y="34" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#294237" text-anchor="start">Mountain Hut</text><text x="84" y="48" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#777B73" text-anchor="start">RIFUGIO LARICE · 2.180 M</text><text x="414" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Il rifugio</text><text x="530" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="start">Le mie prenotazioni</text><text x="690" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Informazioni utili</text><line x1="528" y1="57" x2="638" y2="57" stroke="#315B49"/><circle cx="931" cy="36" r="15" fill="#E9EFE8"/><text x="931" y="40" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#244B3D" text-anchor="middle">GC</text><text x="954" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Giulia Conti</text><text x="48" y="105" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#738073" text-anchor="start">PRENOTAZIONI  /  CONFERMA</text><text x="48" y="141" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#243B32" text-anchor="start">Annulla prenotazione</text><text x="48" y="161" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#777B73" text-anchor="start">Verifica la prenotazione prima di liberare i posti.</text><rect x="48" y="181" width="952" height="512" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="72" y="217" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Prenotazione MH-1804</text><text x="72" y="236" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Rifugio Larice · Sabato 18 luglio · 19:00</text><text x="72" y="264" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#39483F" text-anchor="start">Giulia Conti · 4 persone · Confermata</text><text x="72" y="290" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#A64D3F" text-anchor="start">1 persona · Allergia: frutta a guscio</text><rect x="218" y="322" width="612" height="286" rx="12" fill="#FFFEFB" stroke="#D7D3C8"/><text x="246" y="360" font-family="Georgia,serif" font-size="22" font-weight="400" fill="#243B32" text-anchor="start">Annullare la prenotazione?</text><text x="246" y="389" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Prenotazione MH-1804 · Sabato 18 luglio, 19:00</text><rect x="246" y="408" width="556" height="69" rx="7" fill="#F5ECD9" stroke="none"/><text x="262" y="430" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#806031" text-anchor="start">I posti saranno liberati</text><text x="262" y="449" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">Questa operazione annulla la prenotazione e non può essere annullata.</text><text x="246" y="505" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">L'annullamento è possibile fino all'inizio del turno.</text><rect x="246" y="540" width="160" height="34" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/><text x="326" y="562" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="middle">Mantieni</text><rect x="598" y="540" width="204" height="34" rx="6" fill="#F9EDE8" stroke="#E8C6BE"/><text x="700" y="562" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#A64D3F" text-anchor="middle">Sì, annulla</text><text x="72" y="654" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Anche lo staff usa la stessa conferma per annullare per conto dell'ospite.</text><line x1="0" y1="778" x2="1048" y2="778" stroke="#E7E3D9"/><text x="44" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="start">Mountain Hut — Team 09 · Software Engineering II · Politecnico di Torino</text><text x="1004" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="end">Prototipo · Prenotazioni</text></svg>