<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="810" viewBox="0 0 1048 810"><title>La tua prenotazione</title><rect x="0" y="0" width="1048" height="810" rx="0" fill="#F4F2EC" stroke="#F4F2EC"/><rect x="0" y="0" width="1048" height="4" rx="0" fill="#244B3D" stroke="#244B3D"/><rect x="0" y="4" width="1048" height="64" rx="0" fill="#FFFEFB" stroke="#FFFEFB"/><line x1="0" y1="68" x2="1048" y2="68" stroke="#E7E3D9"/><rect x="44" y="20" width="30" height="30" rx="8" fill="#E9EFE8" stroke="none"/><path d="M50 42 57 29l5 8 4-5 5 10z" fill="none" stroke="#315B49" stroke-width="1.8" stroke-linejoin="round"/><text x="84" y="34" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#294237" text-anchor="start">Mountain Hut</text><text x="84" y="48" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#777B73" text-anchor="start">RIFUGIO LARICE · 2.180 M</text><text x="414" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Il rifugio</text><text x="530" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="start">Le mie prenotazioni</text><text x="690" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Informazioni utili</text><line x1="528" y1="57" x2="638" y2="57" stroke="#315B49"/><circle cx="931" cy="36" r="15" fill="#E9EFE8"/><text x="931" y="40" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#244B3D" text-anchor="middle">GC</text><text x="954" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Giulia Conti</text><text x="48" y="105" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#738073" text-anchor="start">LE MIE PRENOTAZIONI  /  ESITO</text><text x="48" y="141" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#243B32" text-anchor="start">La tua prenotazione</text><text x="48" y="161" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#777B73" text-anchor="start">Esiti della modifica e stato della comunicazione.</text><rect x="48" y="181" width="952" height="64" rx="7" fill="#E9F0E7" stroke="none"/><text x="64" y="203" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#244B3D" text-anchor="start">Modifica confermata</text><text x="64" y="222" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#244B3D" text-anchor="start">La tua prenotazione è stata aggiornata. Email di aggiornamento inviata.</text><rect x="48" y="261" width="565" height="248" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="70" y="292" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Prenotazione aggiornata</text><text x="70" y="311" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">MH-1804 · Confermata</text><text x="70" y="338" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#777B73" text-anchor="start">DATA</text><text x="70" y="358" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#39483F" text-anchor="start">Domenica 19 luglio 2026</text><text x="348" y="338" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#777B73" text-anchor="start">TURNO</text><text x="348" y="358" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#39483F" text-anchor="start">Pranzo · 12:00 – 13:30</text><text x="70" y="393" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#777B73" text-anchor="start">GRUPPO</text><text x="70" y="413" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#39483F" text-anchor="start">4 persone</text><text x="348" y="393" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="#777B73" text-anchor="start">ESIGENZE</text><text x="348" y="413" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#39483F" text-anchor="start">1 allergia · 2 vegetariani</text><rect x="70" y="453" width="190" height="34" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/><text x="165" y="475" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="middle">Le mie prenotazioni</text><rect x="633" y="261" width="367" height="248" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="655" y="292" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Conferma email</text><rect x="655" y="312" width="110" height="22" rx="10" fill="#E9F0E7" stroke="none"/><text x="710" y="327" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#244B3D" text-anchor="middle">Email inviata</text><text x="655" y="365" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Inviata a giulia.conti@example.com</text><text x="655" y="395" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Se l'invio non riesce, la modifica</text><text x="655" y="411" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">rimane comunque confermata.</text><rect x="48" y="531" width="952" height="102" rx="7" fill="#F9EDE8" stroke="none"/><text x="64" y="553" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#A64D3F" text-anchor="start">Stato alternativo · posti insufficienti</text><text x="64" y="572" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#A64D3F" text-anchor="start">Non ci sono abbastanza posti nel turno scelto. La prenotazione originale è invariata.</text><text x="64" y="587" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#A64D3F" text-anchor="start">Scegli un altro turno oppure torna alle tue prenotazioni.</text><rect x="70" y="656" width="185" height="34" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/><text 