<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="810" viewBox="0 0 1048 810">
  <title>Conferma la copia della settimana - staff</title>
  <rect width="1048" height="810" fill="#F4F2EC"/>
  <rect width="170" height="810" fill="#193D33"/>
  <text x="20" y="40" font-family="Arial" font-size="16" fill="#fff">△  Mountain Hut</text>
  <text x="20" y="100" font-family="Arial" font-size="9" fill="#B5C9BD">GESTIONE RIFUGIO</text>
  <text x="25" y="132" font-family="Arial" font-size="11" fill="#D8E6DD">Servizio del giorno</text>
  <text x="25" y="167" font-family="Arial" font-size="11" fill="#D8E6DD">Prenotazioni</text>
  <rect x="14" y="184" width="142" height="34" rx="6" fill="#315B4D"/>
  <text x="25" y="206" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">Pianificazione</text>
  <text x="25" y="243" font-family="Arial" font-size="11" fill="#D8E6DD">Menù</text>
  <rect x="170" width="878" height="64" fill="#FFFEFB"/>
  <text x="202" y="39" font-family="Arial" font-size="10" fill="#777B73">Rifugio Larice  ›  Pianificazione  ›  Conferma copia</text>
  <text x="202" y="110" font-family="Arial" font-size="9" fill="#738073">RIEPILOGO PRIMA DELLA COPIA</text>
  <text x="202" y="146" font-family="Georgia" font-size="29" fill="#243B32">Controlla e conferma</text>
  <text x="202" y="169" font-family="Arial" font-size="11" fill="#777B73">Verifica le settimane interessate prima di applicare la pianificazione.</text>
  <rect x="202" y="195" width="810" height="473" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/>
  <text x="228" y="230" font-family="Georgia" font-size="19" fill="#243B32">Settimana originale</text>
  <text x="228" y="255" font-family="Arial" font-size="11" fill="#39483F">13 – 19 luglio 2026  ·  7 turni</text>
  <line x1="228" y1="276" x2="986" y2="276" stroke="#E7E3D9"/>
  <text x="228" y="307" font-family="Georgia" font-size="19" fill="#243B32">Settimane di destinazione</text>
  <text x="228" y="339" font-family="Arial" font-size="11" fill="#39483F">20 – 26 luglio 2026</text>
  <text x="228" y="364" font-family="Arial" font-size="11" fill="#39483F">27 luglio – 2 agosto 2026</text>
  <rect x="228" y="393" width="758" height="85" rx="6" fill="#F5ECD9"/>
  <text x="245" y="418" font-family="Arial" font-size="11" font-weight="bold" fill="#806031">I turni presenti nelle destinazioni saranno sostituiti.</text>
  <text x="245" y="439" font-family="Arial" font-size="10" fill="#806031">Qualsiasi prenotazione, anche annullata, blocca l'intera operazione.</text>
  <text x="245" y="458" font-family="Arial" font-size="10" fill="#806031">Le prenotazioni e i menù non vengono copiati.</text>
  <text x="228" y="517" font-family="Arial" font-size="10" fill="#777B73">La disponibilità delle settimane viene verificata di nuovo alla conferma.</text>
  <rect x="228" y="594" width="155" height="38" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/>
  <text x="305" y="618" font-family="Arial" font-size="10" font-weight="bold" fill="#244B3D" text-anchor="middle">Torna alle scelte</text>
  <rect x="807" y="594" width="179" height="38" rx="6" fill="#244B3D"/>
  <text x="896" y="618" font-family="Arial" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Conferma la copia</text>
  <text x="202" y="780" font-family="Arial" font-size="8" fill="#898A82">Mountain Hut — Team 09 · Prototipo statico</text>
</svg>
