<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="810" viewBox="0 0 1048 810"><title>Le mie prenotazioni</title><rect x="0" y="0" width="1048" height="810" rx="0" fill="#F4F2EC" stroke="#F4F2EC"/><rect x="0" y="0" width="1048" height="4" rx="0" fill="#244B3D" stroke="#244B3D"/><rect x="0" y="4" width="1048" height="64" rx="0" fill="#FFFEFB" stroke="#FFFEFB"/><line x1="0" y1="68" x2="1048" y2="68" stroke="#E7E3D9"/><rect x="44" y="20" width="30" height="30" rx="8" fill="#E9EFE8" stroke="none"/><path d="M50 42 57 29l5 8 4-5 5 10z" fill="none" stroke="#315B49" stroke-width="1.8" stroke-linejoin="round"/><text x="84" y="34" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#294237" text-anchor="start">Mountain Hut</text><text x="84" y="48" font-family="Arial,sans-serif" font-size="7" font-weight="400" fill="#777B73" text-anchor="start">RIFUGIO LARICE · 2.180 M</text><text x="414" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Il rifugio</text><text x="530" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="start">Le mie prenotazioni</text><text x="690" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Informazioni utili</text><line x1="528" y1="57" x2="638" y2="57" stroke="#315B49"/><circle cx="931" cy="36" r="15" fill="#E9EFE8"/><text x="931" y="40" font-family="Arial,sans-serif" font-size="8" font-weight="600" fill="#244B3D" text-anchor="middle">GC</text><text x="954" y="40" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#39483F" text-anchor="start">Giulia Conti</text><text x="48" y="105" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#738073" text-anchor="start">LA TUA PROSSIMA SOSTA</text><text x="48" y="141" font-family="Georgia,serif" font-size="29" font-weight="400" fill="#243B32" text-anchor="start">Le mie prenotazioni</text><text x="48" y="161" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#777B73" text-anchor="start">Le azioni disponibili dipendono dall'inizio del turno.</text><rect x="48" y="181" width="952" height="70" rx="7" fill="#F5ECD9" stroke="none"/><text x="64" y="203" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#806031" text-anchor="start">Le modifiche sono chiuse</text><text x="64" y="222" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#806031" text-anchor="start">Mancano meno di 48 ore al turno. Puoi ancora annullare fino all'inizio del servizio.</text><rect x="48" y="267" width="604" height="286" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="70" y="299" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#39483F" text-anchor="start">Sabato 18 luglio 2026</text><rect x="527" y="282" width="102" height="22" rx="10" fill="#E9F0E7" stroke="none"/><text x="578" y="297" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#244B3D" text-anchor="middle">Confermata</text><text x="70" y="335" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Rifugio Larice</text><text x="70" y="359" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">Cena · 19:00 – 20:15  ·  4 persone  ·  MH-1804</text><text x="70" y="394" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#A64D3F" text-anchor="start">1 persona · Allergia: frutta a guscio</text><line x1="70" y1="418" x2="630" y2="418" stroke="#E7E3D9"/><text x="70" y="444" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#777B73" text-anchor="start">Modifica non disponibile: termine di 48 ore superato.</text><rect x="70" y="477" width="190" height="34" rx="6" fill="#F9EDE8" stroke="#E8C6BE"/><text x="165" y="499" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#A64D3F" text-anchor="middle">Annulla prenotazione</text><rect x="672" y="267" width="328" height="210" rx="9" fill="#FFFEFB" stroke="#E7E3D9"/><text x="694" y="299" font-family="Georgia,serif" font-size="19" font-weight="400" fill="#243B32" text-anchor="start">Piani cambiati?</text><text x="694" y="334" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">L'annullamento è possibile prima</text><text x="694" y="352" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">che il turno inizi, anche dopo la</text><text x="694" y="370" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#777B73" text-anchor="start">chiusura delle modifiche.</text><rect x="694" y="407" width="195" height="34" rx="6" fill="#FFFEFB" stroke="#D8D5CB"/><text x="791.5" y="429" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#244B3D" text-anchor="middle">Contatta il rifugio</text><line x1="0" y1="778" x2="1048" y2="778" stroke="#E7E3D9"/><text x="44" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="start">Mountain Hut — Team 09 · Software Engineering II · Politecnico di Torino</text><text x="1004" y="797" font-family="Arial,sans-serif" font-size="8" font-weight="400" fill="#898A82" text-anchor="end">Prototipo · Prenotazioni</text></svg>