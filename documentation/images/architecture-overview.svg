<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title description">
  <title id="title">Mountain Hut application architecture</title>
  <desc id="description">A React and Vite browser client calls an Express API. Domain services access PostgreSQL and send booking confirmations through SMTP.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6ef"/>
      <stop offset="1" stop-color="#e9f0e9"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#47715e"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #183b31; }
      .muted { fill: #587268; }
      .card { fill: #ffffff; stroke: #d3e0d7; stroke-width: 2; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #6b8978; }
      .heading { font-size: 24px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 13px; }
      .connector { fill: none; stroke: #47715e; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="620" rx="28" fill="url(#background)"/>
  <path d="M0 470 C240 430 360 520 600 470 S1000 430 1280 475 V620 H0 Z" fill="#e1ebe1" opacity=".65"/>
  <text x="48" y="58" font-size="31" font-weight="800">Mountain Hut | Application architecture</text>
  <text x="50" y="88" class="body muted">A small, layered web application with PostgreSQL persistence and optional local infrastructure.</text>
  <rect x="1018" y="34" width="216" height="34" rx="17" fill="#dcebe0"/>
  <text x="1126" y="56" text-anchor="middle" class="small" font-weight="700">DOCKER IS OPTIONAL</text>

  <path class="connector" d="M300 294 H340"/>
  <path class="connector" d="M590 294 H640"/>
  <path class="connector" d="M940 245 H1000"/>
  <path class="connector" d="M940 378 H1000"/>
  <text x="320" y="276" text-anchor="middle" class="small" font-weight="700">HTTP JSON</text>
  <text x="615" y="276" text-anchor="middle" class="small" font-weight="700">routes</text>
  <text x="970" y="226" text-anchor="middle" class="small" font-weight="700">SQL</text>
  <text x="970" y="359" text-anchor="middle" class="small" font-weight="700">email</text>

  <rect x="40" y="142" width="260" height="310" rx="20" class="card"/>
  <rect x="340" y="142" width="250" height="310" rx="20" class="card"/>
  <rect x="640" y="142" width="300" height="310" rx="20" class="card"/>
  <rect x="1000" y="170" width="240" height="150" rx="18" class="card"/>
  <rect x="1000" y="350" width="240" height="120" rx="18" class="card"/>

  <circle cx="68" cy="176" r="8" fill="#6ba47b"/>
  <text x="86" y="181" class="eyebrow">01 / CLIENT</text>
  <text x="62" y="222" class="heading">Web app</text>
  <text x="62" y="260" class="body">React 18 and Vite 8</text>
  <text x="62" y="292" class="body">React Router 7</text>
  <text x="62" y="324" class="body">Hiker and staff pages</text>
  <text x="62" y="356" class="body">Cookie-authenticated API</text>
  <text x="62" y="406" class="small muted">Browser UI and user journeys</text>

  <circle cx="368" cy="176" r="8" fill="#d69451"/>
  <text x="386" y="181" class="eyebrow">02 / API</text>
  <text x="362" y="222" class="heading">Express 5</text>
  <text x="362" y="260" class="body">Versioned REST routes</text>
  <text x="362" y="292" class="body">Controllers and validation</text>
  <text x="362" y="324" class="body">JWT and role middleware</text>
  <text x="362" y="356" class="body">Central error handling</text>
  <text x="362" y="406" class="small muted">Node.js application server</text>

  <circle cx="668" cy="176" r="8" fill="#6ba47b"/>
  <text x="686" y="181" class="eyebrow">03 / DOMAIN</text>
  <text x="662" y="222" class="heading">Application services</text>
  <text x="662" y="260" class="body">Booking and table allocation</text>
  <text x="662" y="292" class="body">Slot and capacity management</text>
  <text x="662" y="324" class="body">Availability calculation</text>
  <text x="662" y="356" class="body">Confirmation email workflow</text>
  <text x="662" y="406" class="small muted">Repositories isolate SQL access</text>

  <circle cx="1028" cy="201" r="7" fill="#6ba47b"/>
  <text x="1044" y="206" class="eyebrow">PERSISTENCE</text>
  <text x="1022" y="247" class="heading">PostgreSQL</text>
  <text x="1022" y="278" class="body">pg connection pool</text>
  <text x="1022" y="301" class="small muted">7 tables and 1 availability view</text>

  <circle cx="1028" cy="380" r="7" fill="#d69451"/>
  <text x="1044" y="385" class="eyebrow">MESSAGING</text>
  <text x="1022" y="421" class="heading">SMTP</text>
  <text x="1022" y="447" class="small muted">Mailpit or configured provider</text>

  <rect x="40" y="508" width="1200" height="72" rx="18" fill="#183b31"/>
  <text x="66" y="540" font-size="16" font-weight="700" fill="#ffffff">LOCAL DEVELOPMENT</text>
  <text x="66" y="563" font-size="14" fill="#e3eee6">Run PostgreSQL, the backend, and the frontend as separate services. Docker Compose is an optional shortcut for the database and Mailpit.</text>
</svg>
